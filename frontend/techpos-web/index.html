<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#d4a017" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <title>Hoàn Ngọc Group — Quản lý bán hàng</title>
    <script>
      window.__errors = [];
      window.addEventListener('error', function (e) { window.__errors.push(String(e.message || e) + ' @ ' + (e.filename || '') + ':' + (e.lineno || 0)); });
      window.addEventListener('unhandledrejection', function (e) { window.__errors.push('PROMISE: ' + String(e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
